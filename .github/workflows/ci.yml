name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# What is worth testing here is not that the code compiles — it is that the drivers still understand
# the screens they are pointed at. That is why the interesting jobs (real Claude Code against a mock
# model, in a container with a real tmux) are the ones being built out next; see docs/.

jobs:
  applets:
    name: applets (engine + drivers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - name: Upload the built drivers
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: drivers
          path: applets/dist

  go:
    name: cli (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          go vet ./...
          # -race, because this is the most concurrent code in the organisation and none of it was
          # being checked for races: a screen manager dispatching from a socket goroutine into
          # terminals, transports reconnecting underneath it, and a viewer relay reading while the
          # program writes. A data race there does not crash — it corrupts a terminal or drops a
          # message, months later, on someone else's machine.
          go test -race ./...

  # macOS gets the exact same job as Linux, not a narrowed one: it has a real tmux (via Homebrew)
  # and creack/pty has a real Darwin implementation, so screens genuinely work there — this is what
  # makes "macOS should work unchanged" a tested claim instead of an assumption, the same gap that
  # WSL support above exists to close for Linux-under-Windows.
  go-macos:
    name: cli (build + tests, macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          command -v tmux >/dev/null || brew install tmux
          go vet ./...
          go test -race ./...

  # Native Windows has no tmux/pty backend at all (screens are ErrUnsupported there by design — see
  # terminal.ErrUnsupported), so this is deliberately narrower than the Linux `go` job: no tmux
  # install, no -race (Windows' race detector needs a C toolchain this runner doesn't carry). What it
  # exists to catch is what cross-compiling from Linux cannot: real Windows build/vet/test failures
  # (path handling, the service package's Windows-only branches, wsl.conf helpers that must no-op
  # cleanly off Linux) — the same class of "assumed to work, never actually run" gap that WSL support
  # was added specifically to close.
  go-windows:
    name: cli (build + tests, windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...

  # The job this repository exists for. `fake` is the deterministic baseline — if it is red, we broke
  # something. The real-Claude legs answer a different question: whether Claude Code changed under
  # us. The pinned one is required, because pinned means it can only break when we change something;
  # `installer` follows the latest release and is advisory, since an upstream UI change is
  # intelligence worth having rather than a reason to block a merge.
  # macOS gets the same legs as Linux, not a subset: it has a real tmux (Homebrew) and node/go both
  # run natively, so there is no structural reason the reference connector wouldn't work there too —
  # and "should work on macOS" stays an assumption until something actually runs it. Native Windows
  # has no matrix entry: it cannot host a screen at all (see terminal.ErrUnsupported), and this whole
  # testbed is built around driving one, so there is nothing here for it to run.
  testbed:
    name: testbed (${{ matrix.leg }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fake
            os: ubuntu-latest
            experimental: false
          - leg: npm:2.1.220
            os: ubuntu-latest
            experimental: false
          - leg: pi:0.87.0
            os: ubuntu-latest
            experimental: false
          - leg: installer
            os: ubuntu-latest
            experimental: true
          - leg: fake
            os: macos-latest
            experimental: false
          - leg: npm:2.1.220
            os: macos-latest
            experimental: false
          - leg: installer
            os: macos-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-java@v4
        if: matrix.leg != 'fake'
        with:
          distribution: temurin
          java-version: "21"
      - name: End to end (${{ matrix.leg }})
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "${{ matrix.os }}" = "macos-latest" ]; then brew install tmux; else sudo apt-get install -y -qq tmux; fi
          fi
          bash testbed/e2e.sh "${{ matrix.leg }}"

  ci-success:
    name: CI success
    needs: [applets, go, go-macos, go-windows, testbed]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
