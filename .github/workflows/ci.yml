name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# What is worth testing here is not that the code compiles — it is that the drivers still understand
# the screens they are pointed at. That is why the interesting jobs (real Claude Code against a mock
# model, in a container with a real tmux) are the ones being built out next; see docs/.

jobs:
  applets:
    name: applets (engine + drivers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - name: Upload the built drivers
        uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: applets/dist

  go:
    name: cli (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          go vet ./...
          go test ./...

  testbed:
    name: testbed (control plane + connector + real tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: End to end
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          bash testbed/e2e.sh

  ci-success:
    name: CI success
    needs: [applets, go, testbed]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
