name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Unit tests for the drivers and the Go library on Linux, macOS and Windows, and the testbed: a
# connector built from the library driving real programs (a fake one, Claude Code, pi) in a real
# tmux against the reference control plane.

jobs:
  applets:
    name: applets (engine + drivers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload the built drivers
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: drivers
          path: applets/dist

  go:
    name: cli (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          go vet ./...
          # -race: screens, viewers, the lease and the transport all run concurrently, and a race
          # there corrupts a terminal or drops a message instead of crashing.
          go test -race ./...

  # macOS has a real tmux and pty, so it runs the same tests as Linux.
  go-macos:
    name: cli (build + tests, macos)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          command -v tmux >/dev/null || brew install tmux
          go vet ./...
          go test -race ./...

  # Windows cannot host screens (terminal.ErrUnsupported); this proves the library builds and the
  # rest of it passes there. No -race: the runner has no C toolchain for it.
  go-windows:
    name: cli (build + tests, windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...

  # The testbed legs: `fake` is the deterministic baseline; `npm:<version>` and `pi:<version>` run a
  # pinned real program against a mock model and are required; `installer` follows the latest
  # Claude Code release and is advisory. Windows has no leg because it cannot host a screen.
  testbed:
    name: testbed (${{ matrix.leg }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fake
            os: ubuntu-latest
            experimental: false
          - leg: npm:2.1.220
            os: ubuntu-latest
            experimental: false
          - leg: pi:0.87.0
            os: ubuntu-latest
            experimental: false
          - leg: installer
            os: ubuntu-latest
            experimental: true
          - leg: fake
            os: macos-latest
            experimental: false
          - leg: npm:2.1.220
            os: macos-latest
            experimental: false
          - leg: installer
            os: macos-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-java@v6
        if: matrix.leg != 'fake'
        with:
          distribution: temurin
          java-version: "21"
      - name: End to end (${{ matrix.leg }})
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "${{ matrix.os }}" = "macos-latest" ]; then brew install tmux; else sudo apt-get install -y -qq tmux; fi
          fi
          bash testbed/e2e.sh "${{ matrix.leg }}"

  ci-success:
    name: CI success
    needs: [applets, go, go-macos, go-windows, testbed]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
